[project]
name = "rocket-league-ai"
version = "0.1.0"
description = "An agent in Rocket League trained using rlgym"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "rlgym[all]==2.0.1",
    "rlgym-tools==2.6.0",
    "rlgym-ppo",
    "torch==2.9.1",
    "numpy==1.26.4",
    "wandb==0.23.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.uv.sources]
rlgym-ppo = { git = "https://github.com/AechPro/rlgym-ppo", rev = "4ffd2e924198bf4b2d59f4bf280b29919d7c07ea" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
